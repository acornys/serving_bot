<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C2440">
<title>서빙봇 주방 패널</title>
<style>
:root{
  color-scheme:light;
  --navy:#1C2440; --navy2:#2A3560; --cream:#FBF3E4; --paper:#FFFBF3; --card:#FFFFFF;
  --ink:#1C2440; --muted:#6A7088; --line:#E8DCC6;
  --orange:#E8973A; --orange-d:#C9741C; --orange-bg:#FDEBD2;
  --green:#2E8B62; --green-bg:#DDF1E6;
  --red:#C8402F; --red-d:#A53021; --red-bg:#FBE2DD;
  --floor:#F4E6CC; --wall:#1C2440;
  --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;word-break:keep-all;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit;color:inherit}

/* ── 머리 ── */
.top{background:var(--navy);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 46px;
  background-image:radial-gradient(circle at 12px 12px,rgba(255,255,255,.07) 2px,transparent 2.5px);background-size:24px 24px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand small{font-size:.72rem;letter-spacing:.14em;color:#F3C98B;font-weight:700}
.brand b{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:6px 10px;border-radius:999px;
  background:rgba(255,255,255,.12);white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;background:#9AA3C0}
.pill.ok i{background:#5FD39A} .pill.demo i{background:#F3C14B} .pill.off i{background:#F0796A}

.wrap{max-width:560px;margin:-32px auto 0;padding:0 16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 0 rgba(28,36,64,.05)}

/* ── 로봇 상태 ── */
.now{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center;padding:14px 16px 12px}
.now img{width:104px;height:104px;object-fit:contain;display:block}
.now.moving img{animation:bob .7s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.now h1{margin:0;font-size:1.3rem;font-weight:800;line-height:1.25;letter-spacing:-.01em;text-wrap:balance}
.now p{margin:2px 0 0;font-size:.9rem;color:var(--muted)}
.now .tag{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.06em;padding:2px 9px;border-radius:999px;
  background:var(--line);color:var(--navy);margin-bottom:5px}
.now.moving .tag{background:var(--orange-bg);color:var(--orange-d)}
.now.good .tag{background:var(--green-bg);color:var(--green)}
.now.bad .tag{background:var(--red-bg);color:var(--red)}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 16px 12px;border-top:1px dashed var(--line)}
.steps:empty{display:none}
.st{font-size:.85rem;font-weight:800;min-width:34px;height:30px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
  background:#F1ECE1;color:var(--muted)}
.st.done{background:var(--green-bg);color:var(--green)}
.st.cur{background:var(--orange);color:#fff;animation:pulse 1.1s ease-in-out infinite}
.st.fail{background:var(--red-bg);color:var(--red)}
.ar{color:#B9B3A4;font-size:.8rem}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(232,151,58,.25)}}
.xy{margin-left:auto;font-family:var(--mono);font-size:.74rem;color:var(--muted)}

/* ── 맵 ── */
.maphd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 16px 0}
.maphd h2{margin:0;font-size:1.02rem;font-weight:800}
.maphd span{font-size:.78rem;color:var(--muted)}
.map{padding:8px 10px 6px}
.map svg{display:block;width:100%;height:auto;touch-action:manipulation}
.floor{fill:var(--floor)} .room{fill:none;stroke:var(--wall);stroke-width:10}
.wl{fill:var(--wall)} .kz{fill:#fff;opacity:.55}
.br{fill:none;stroke:var(--wall);stroke-width:2;stroke-dasharray:6 5}
.tb{cursor:pointer}
.tb circle.b{fill:#fff;stroke:var(--navy);stroke-width:4;transition:fill .15s,stroke .15s}
.tb text.n{font:800 34px var(--sans);fill:var(--navy);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tb.sel circle.b{fill:var(--orange);stroke:var(--orange-d)} .tb.sel text.n{fill:#fff}
.tb.done circle.b{fill:var(--green-bg);stroke:var(--green)} .tb.done text.n{fill:var(--green)}
.tb.goal circle.b{fill:var(--orange-bg);stroke:var(--orange)}
.tb .ring{fill:none;stroke:var(--orange);stroke-width:5;opacity:0}
.tb.goal .ring{animation:ring 1.2s ease-out infinite}
@keyframes ring{0%{opacity:.9;r:44px}100%{opacity:0;r:68px}}
.tb .od{display:none} .tb.sel .od{display:block}
.tb .od circle{fill:var(--navy)} .tb .od text{font:800 20px var(--sans);fill:#fff;text-anchor:middle;dominant-baseline:central}
.tb.lock{cursor:default} .tb.lock circle.b{opacity:.75}
.tb:focus-visible circle.b{stroke:var(--orange-d);stroke-width:7}
.kt circle.b{fill:var(--navy);stroke:var(--navy)} .kt text.n{fill:#fff;font-size:22px}
.kt.goal circle.b{fill:var(--navy2);stroke:var(--orange)}
.lbl{font:800 26px var(--sans);fill:var(--navy);text-anchor:middle}
#bot{transition:transform .9s cubic-bezier(.4,0,.2,1);pointer-events:none}

/* ── 들어온 주문 ── */
.ords{list-style:none;margin:0;padding:6px 10px 10px;display:flex;flex-direction:column;gap:6px}
.ords li{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:12px;border:2px solid transparent;background:#FAF5EA}
.ords li.w{cursor:pointer} .ords li.w.on{border-color:var(--orange);background:var(--orange-bg)}
.ords .tn{width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;font-size:1.3rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.ords li.on .tn{background:var(--orange)}
.ords b{display:block;font-size:.95rem;font-weight:800;line-height:1.3}
.ords small{font-size:.78rem;color:var(--muted)}
.ords .chip{font-size:.74rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.ords .chip.s{background:var(--orange-bg);color:var(--orange-d)} .ords .chip.a{background:var(--green-bg);color:var(--green)}
.ords .x{width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:1.1rem;cursor:pointer}
.ords .x:active{background:var(--line)}
.ords .none{display:block;background:transparent;color:var(--muted);font-size:.9rem;padding:6px 8px 4px}
.tb .nb{display:none} .tb.has .nb{display:block}
.tb .nb circle{fill:var(--red)} .tb .nb text{font:800 18px var(--sans);fill:#fff;text-anchor:middle;dominant-baseline:central}

/* ── 보내기 ── */
.send{padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px}
.pick{font-size:.9rem;color:var(--muted);min-height:1.5em}
.pick b{color:var(--ink)}
.go{width:100%;min-height:58px;border:0;border-radius:14px;background:var(--orange);color:#fff;font-size:1.12rem;font-weight:800;
  cursor:pointer;box-shadow:0 4px 0 var(--orange-d);transition:transform .05s,box-shadow .05s}
.go:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--orange-d)}
.go:disabled{background:#E9E2D3;color:#A39C8C;box-shadow:0 4px 0 #D8D0BE;cursor:default}
.go small{display:block;font-size:.74rem;font-weight:600;opacity:.92;margin-top:1px}
.row{display:grid;grid-template-columns:1.3fr 1.2fr .8fr;gap:8px}
.sec{min-height:48px;border-radius:12px;border:2px solid var(--navy);background:#fff;font-size:.92rem;font-weight:800;cursor:pointer;padding:0 6px}
.sec small{display:block;font-size:.68rem;font-weight:600;color:var(--muted)}
.sec.ghost{border-color:var(--line);color:var(--muted)}
.sec:disabled{opacity:.4;cursor:default}
.sec:active:not(:disabled){background:var(--cream)}
.hint{font-size:.8rem;color:var(--muted);text-align:center;min-height:1.3em}

/* ── 기록 ── */
.loghd{padding:14px 16px 4px;font-size:1.02rem;font-weight:800}
.log{list-style:none;margin:0;padding:0 16px 12px}
.log li{display:grid;grid-template-columns:4.6rem 1fr;gap:8px;padding:7px 0;border-top:1px solid #F3EBDB;font-size:.88rem}
.log li:first-child{border-top:0}
.log time{font-family:var(--mono);font-size:.76rem;color:var(--muted);padding-top:2px}
.log .order{font-weight:700} .log .good{color:var(--green);font-weight:700} .log .bad{color:var(--red);font-weight:700}
.log .empty{grid-column:1/-1;color:var(--muted)}
.foot{font-size:.74rem;color:var(--muted);text-align:center;padding:2px 0 6px}

/* ── 긴급 정지 (항상 아래에) ── */
.stopbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--cream) 70%,rgba(251,243,228,0))}
.stop{display:block;width:100%;max-width:528px;margin:0 auto;min-height:64px;border:0;border-radius:16px;background:var(--red);color:#fff;
  font-size:1.25rem;font-weight:900;letter-spacing:.02em;cursor:pointer;box-shadow:0 5px 0 var(--red-d)}
.stop:active{transform:translateY(4px);box-shadow:0 1px 0 var(--red-d)}
.stop small{display:block;font-size:.72rem;font-weight:600;opacity:.9}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:20;
  max-width:calc(100vw - 32px);background:var(--navy);color:#fff;font-size:.9rem;font-weight:700;padding:10px 16px;border-radius:12px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)} .toast.bad{background:var(--red)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><small>SERVING BOT · 주방 패널</small><b>식당 서빙봇</b></div>
    <span class="pill" id="pill"><i></i><span id="pillT">연결 확인 중</span></span>
  </div>
</header>

<main class="wrap">

  <!-- 로봇 상태 -->
  <section class="card" aria-live="polite">
    <div class="now" id="now">
      <img id="face" src="/static/img/robot_idle.png" alt="">
      <div>
        <span class="tag" id="tag">확인 중</span>
        <h1 id="title">로봇 상태를 기다리는 중</h1>
        <p id="sub">잠시만요</p>
      </div>
    </div>
    <div class="steps" id="steps"></div>
  </section>

  <!-- 들어온 주문 (손님 폰에서 넣은 것) -->
  <section class="card">
    <div class="maphd"><h2>들어온 주문</h2><span id="ordCnt">누르면 그 테이블이 골라져요</span></div>
    <ul class="ords" id="ords"><li class="none">아직 주문이 없어요</li></ul>
  </section>

  <!-- 맵 · 테이블 고르기 -->
  <section class="card">
    <div class="maphd"><h2>테이블 고르기</h2><span>누른 순서대로 가요 · 다시 누르면 빠져요</span></div>
    <div class="map">
      <svg id="map" viewBox="55 55 750 516" role="group" aria-label="식당 맵. 테이블 1번부터 6번과 주방">
        <rect class="floor" x="70" y="70" width="720" height="486" rx="4"/>
        <!-- 10/8 배치 (맵_1008_미리보기.svg 와 같은 그림) -->
        <rect class="kz" x="70" y="316" width="266" height="240"/>
        <rect class="wl" x="70" y="300" width="180" height="16"/>
        <rect class="wl" x="250" y="70" width="16" height="90"/>
        <rect class="wl" x="580" y="70" width="16" height="90"/>
        <rect class="wl" x="336" y="466" width="16" height="90"/>
        <rect class="wl" x="566" y="466" width="16" height="90"/>
        <rect class="wl" x="700" y="280" width="90" height="16"/>
        <rect class="wl" x="415" y="190" width="30" height="14"/>
        <rect class="wl" x="415" y="358" width="30" height="14"/>
        <rect class="wl" x="520" y="298" width="80" height="16"/>
        <rect class="br" x="415" y="190" width="30" height="182"/>
        <rect class="room" x="70" y="70" width="720" height="486" rx="4"/>
        <text class="lbl" x="235" y="525">주방</text>
        <g id="spots"></g>
        <image id="bot" href="/static/img/robot_idle.png" width="92" height="92" x="-46" y="-46"/>
      </svg>
    </div>
    <div class="send">
      <div class="pick" id="pick">테이블을 눌러 고르세요</div>
      <button class="go" id="go" type="button" disabled>테이블을 눌러 고르세요</button>
      <div class="row">
        <button class="sec" id="all" type="button">전체 돌기<small>모드 1 · 1→6</small></button>
        <button class="sec" id="home" type="button">🏠 주방 복귀<small>0번</small></button>
        <button class="sec ghost" id="clr" type="button" disabled>지우기</button>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </section>

  <!-- 최근 기록 -->
  <section class="card">
    <div class="loghd">최근 기록</div>
    <ul class="log" id="log"><li><span class="empty">아직 기록이 없어요</span></li></ul>
  </section>
  <div class="foot">맵 그림은 구조만 맞아요 (10/8 배치 · 테이블 6개 · 가운데 점선은 아래로 지나가는 구조물)</div>
</main>

<div class="stopbar"><button class="stop" id="stop" type="button">🚨 긴급 정지<small>그 자리에 바로 멈춤 · 언제든 누를 수 있어요</small></button></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  // 맵 그림 위 자리 (그림 좌표). '0' = 주방
  var SPOT={ '0':[140,440], '1':[459,490], '2':[690,440], '3':[700,170], '4':[512,150], '5':[342,150], '6':[150,185] };
  var BOT_OFF=[52,-46];               // 로봇 그림을 자리 옆에 두는 만큼
  var BUSY=['moving','arrived','returning'];
  var $=function(id){ return document.getElementById(id); };
  var NS='http://www.w3.org/2000/svg';
  var sel=[], S=null, tables=['1','2','3','4','5','6'], lastSpot='0', holdEnd=0, holdKey='', toastT=0;

  // ── 맵에 자리 그리기 ──
  function el(n,a,t){ var e=document.createElementNS(NS,n); for(var k in a) e.setAttribute(k,a[k]); if(t!=null) e.textContent=t; return e; }
  function drawSpots(){
    var g=$('spots'); g.textContent='';
    ['0'].concat(tables).forEach(function(t){
      var p=SPOT[t]; if(!p) return;
      var b=el('g',{'class':'tb'+(t==='0'?' kt':''),'data-t':t,transform:'translate('+p[0]+','+p[1]+')'});
      if(t!=='0'){ b.setAttribute('tabindex','0'); b.setAttribute('role','button'); b.setAttribute('aria-label','테이블 '+t); }
      b.appendChild(el('circle',{'class':'ring',r:44}));
      b.appendChild(el('circle',{'class':'b',r:t==='0'?30:42}));
      b.appendChild(el('text',{'class':'n'},t==='0'?'0':t));
      if(t!=='0'){ var o=el('g',{'class':'od',transform:'translate(32,-32)'}); o.appendChild(el('circle',{r:17})); o.appendChild(el('text',{},'')); b.appendChild(o);
        var nb=el('g',{'class':'nb',transform:'translate(-32,-32)'}); nb.appendChild(el('circle',{r:16})); nb.appendChild(el('text',{},'')); b.appendChild(nb); }
      g.appendChild(b);
    });
  }
  function busy(){ return !!(S&&S.live&&BUSY.indexOf(S.status.state)>=0); }
  function canOrder(){ return !!(S&&S.manager&&!busy()); }

  // ── 고른 테이블 표시 ──
  function name(t){ return t==='0'?'주방':t+'번'; }
  function paintSel(){
    var st=S?S.status:{}, done=st.done||[], run=S&&S.live&&['moving','arrived','returning','hold'].indexOf(st.state)>=0;
    document.querySelectorAll('.tb').forEach(function(b){
      var t=b.dataset.t, i=sel.indexOf(t);
      b.classList.toggle('sel',i>=0);
      b.classList.toggle('lock',busy());
      b.classList.toggle('done',!!run&&done.indexOf(t)>=0&&i<0);
      b.classList.toggle('goal',!!(S&&S.live)&&(st.state==='moving'||st.state==='returning')&&st.target===t);
      var o=b.querySelector('.od text'); if(o) o.textContent=i>=0?(i+1):'';
      var wn=waitCount(t), nb=b.querySelector('.nb text'); b.classList.toggle('has',wn>0&&i<0); if(nb) nb.textContent=wn;
    });
    document.querySelectorAll('.ords li.w').forEach(function(li){ li.classList.toggle('on',sel.indexOf(li.dataset.t)>=0); });
    var go=$('go'), ok=canOrder();
    if(!sel.length){ $('pick').textContent='테이블을 눌러 고르세요'; go.innerHTML='테이블을 눌러 고르세요'; go.disabled=true; }
    else if(sel.length===1){ $('pick').innerHTML='보낼 곳: <b>'+sel[0]+'번 테이블</b>'; go.innerHTML=sel[0]+'번 테이블로 보내기<small>모드 2 · 단일 — 도착 후 10초 주문 없으면 주방 복귀</small>'; go.disabled=!ok; }
    else { $('pick').innerHTML='보낼 순서: <b>주방 → '+sel.join(' → ')+' → 주방</b>'; go.innerHTML=sel.length+'곳 차례로 보내기<small>모드 3 · 골라서 — 끝나면 주방 복귀</small>'; go.disabled=!ok; }
    $('all').disabled=!ok; $('home').disabled=!ok; $('clr').disabled=!sel.length;
    $('hint').textContent=!S?'':(!S.manager?'매니저가 꺼져 있어요 — 노트북에서 매니저를 먼저 켜세요':(busy()?'이동 중에는 새 주문을 받지 않아요 (멈추려면 긴급 정지)':''));
  }
  // 그 테이블에 "준비 중" 주문이 몇 건인지
  function waitCount(t){ return ((S&&S.orders)||[]).filter(function(o){ return o.table===t&&o.state==='waiting'; }).length; }
  // 들어온 주문 목록 그리기 — 준비 중인 줄을 누르면 그 테이블이 골라짐
  function paintOrders(){
    var ul=$('ords'), list=(S.orders||[]); ul.textContent='';
    var w=list.filter(function(o){ return o.state==='waiting'; }).length;
    $('ordCnt').textContent=w?'준비 중 '+w+'건 · 누르면 그 테이블이 골라져요':'손님 폰 주소: /order';
    if(!list.length){ var n=document.createElement('li'); n.className='none'; n.textContent='아직 주문이 없어요'; ul.appendChild(n); return; }
    list.forEach(function(o){
      var li=document.createElement('li'), tn=document.createElement('span'), mid=document.createElement('div'), b=document.createElement('b'), sm=document.createElement('small');
      tn.className='tn'; tn.textContent=o.table;
      b.textContent=o.lines.map(function(x){ return x.name+' '+x.qty; }).join(' · '); sm.textContent=o.t+' 주문 · '+o.table+'번 테이블';
      mid.appendChild(b); mid.appendChild(sm); li.appendChild(tn); li.appendChild(mid);
      if(o.state==='waiting'){
        li.className='w'; li.dataset.t=o.table;
        var x=document.createElement('button'); x.type='button'; x.className='x'; x.textContent='✕'; x.setAttribute('aria-label','이 주문 지우기');
        x.addEventListener('click',function(e){ e.stopPropagation(); post('/api/order-cancel',{id:o.id}).then(poll); });
        li.addEventListener('click',function(){ tap(o.table); });
        li.appendChild(x);
      } else {
        var c=document.createElement('span'); c.className='chip '+(o.state==='sent'?'s':'a'); c.textContent=o.state==='sent'?'배달 중':'도착 · 손님 확인 전'; li.appendChild(c);
      }
      ul.appendChild(li);
    });
  }
  function tap(t){ if(t==='0'||busy()) return; var i=sel.indexOf(t); if(i>=0) sel.splice(i,1); else sel.push(t); paintSel(); }
  $('map').addEventListener('click',function(e){ var b=e.target.closest('.tb'); if(b) tap(b.dataset.t); });
  $('map').addEventListener('keydown',function(e){ if(e.key!=='Enter'&&e.key!==' ') return; var b=e.target.closest('.tb'); if(b){ e.preventDefault(); tap(b.dataset.t); } });

  // ── 서버에 보내기 ──
  function toast(msg,bad){ var t=$('toast'); t.textContent=msg; t.className='toast on'+(bad?' bad':''); clearTimeout(toastT); toastT=setTimeout(function(){ t.className='toast'; },2600); }
  function post(url,body){
    return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})
      .then(function(r){ return r.json().then(function(j){ toast(j.msg||'',!j.ok); return j; }); })
      .catch(function(){ toast('서버에 닿지 않아요 (노트북의 web_order.py 확인)',true); return {ok:false}; });
  }
  function order(route){ post('/api/order',{route:route}).then(function(j){ if(j.ok){ sel=[]; paintSel(); poll(); } }); }
  $('go').addEventListener('click',function(){ if(sel.length) order(sel.slice()); });
  $('all').addEventListener('click',function(){ order(tables.slice()); });
  $('home').addEventListener('click',function(){ order(['0']); });
  $('clr').addEventListener('click',function(){ sel=[]; paintSel(); });
  $('stop').addEventListener('click',function(){ post('/api/stop').then(poll); });

  // ── 상태 그리기 ──
  var FACE={idle:'idle',moving:'moving',returning:'moving',arrived:'arrived',hold:'arrived',failed:'trouble',stopped:'trouble',unknown:'idle'};
  var TAG={idle:'대기',moving:'가는 중',returning:'복귀 중',arrived:'도착',hold:'도착 · 주문 대기',failed:'실패',stopped:'정지',unknown:'확인 중'};
  var KIND={moving:'moving',returning:'moving',arrived:'good',hold:'good',failed:'bad',stopped:'bad'};
  function paint(){
    var pill=$('pill'), st=S.status, s=st.state||'unknown';
    if(S.mode==='demo'){ pill.className='pill demo'; $('pillT').textContent='연습 모드 · 로봇 없음'; }
    else if(!S.manager){ pill.className='pill off'; $('pillT').textContent='매니저 꺼짐'; }
    else if(!S.live){ pill.className='pill demo'; $('pillT').textContent='연결됨 · 상태 알림 없음'; }
    else { pill.className='pill ok'; $('pillT').textContent='로봇 연결됨'; }

    var title, sub=st.msg||'';
    if(!S.manager){ s='unknown'; title='매니저가 꺼져 있어요'; sub='노트북에서 매니저를 켜면 주문할 수 있어요'; }
    else if(!S.live){ s='unknown'; title='주문은 보낼 수 있어요'; sub='이 매니저는 상태를 알려 주지 않아요 (v5 매니저로 바꾸면 보여요)'; }
    else if(s==='idle'){ title='주문을 기다리고 있어요'; }
    else if(s==='moving'){ title=name(st.target)+(st.target==='0'?'으로':' 테이블로')+' 가는 중'; sub=(st.route||[]).length>1?'남은 곳을 차례로 돌아요':'도착하면 알려 드려요'; }
    else if(s==='arrived'){ title=name(st.target)+(st.target==='0'?'':' 테이블')+' 도착'; }
    else if(s==='hold'){ title=name(st.target)+' 테이블 도착'; }
    else if(s==='returning'){ title='주방으로 돌아가는 중'; }
    else if(s==='failed'){ title='주문 실패'; }
    else if(s==='stopped'){ title='긴급 정지됨'; sub='그 자리에 멈춰 있어요 · 새 주문이나 주방 복귀를 누르면 다시 움직여요'; }
    else { title='로봇 상태를 기다리는 중'; }

    // 모드 2 도착 후 남은 시간 (화면에서 세는 값)
    if(s==='hold'){
      var key=st.target+'|'+(st.done||[]).join(',');
      if(holdKey!==key){ holdKey=key; holdEnd=Date.now()+(st.hold_sec||10)*1000; }
      var left=Math.max(0,Math.ceil((holdEnd-Date.now())/1000));
      sub=left>0?left+'초 안에 주문이 없으면 주방으로 돌아가요':'곧 주방으로 돌아가요';
    } else holdKey='';

    $('now').className='now '+(KIND[s]||'');
    $('tag').textContent=TAG[s]||'확인 중';
    $('title').textContent=title; $('sub').textContent=sub;
    var src='/static/img/robot_'+(FACE[s]||'idle')+'.png';
    if($('face').getAttribute('src')!==src){ $('face').setAttribute('src',src); $('bot').setAttribute('href',src); }

    // 경로 칩:  주방 → 3 → 1 → 주방
    var box=$('steps'), route=(S.live&&st.route)||[], done=st.done||[]; box.textContent='';
    if(route.length&&route[0]!=='0'&&s!=='idle'){
      var add=function(txt,cls){ var e=document.createElement('span'); e.className=cls; e.textContent=txt; box.appendChild(e); };
      add('주방','st done');
      route.forEach(function(t){ add('→','ar'); var c='st'; if(done.indexOf(t)>=0) c+=' done'; else if(st.target===t&&s==='moving') c+=' cur'; else if(st.target===t&&(s==='failed'||s==='stopped')) c+=' fail'; add((done.indexOf(t)>=0?'✓ ':'')+t,c); });
      add('→','ar'); add('주방','st'+(s==='returning'?' cur':''));
    }
    if(S.live&&st.x!=null){ var xy=document.createElement('span'); xy.className='xy'; xy.textContent='X '+Number(st.x).toFixed(2)+' · Y '+Number(st.y).toFixed(2)+' m'; box.appendChild(xy); }

    // 맵 위 로봇 그림 — 마지막으로 도착한 자리에 둠
    if(S.live){ if(s==='arrived'||s==='hold') lastSpot=st.target; else if(s==='idle') lastSpot='0'; }
    var p=SPOT[lastSpot]||SPOT['0'];
    $('bot').setAttribute('transform','translate('+(p[0]+BOT_OFF[0])+','+(p[1]+BOT_OFF[1])+')');

    // 기록
    var ul=$('log'); ul.textContent='';
    if(!S.log.length){ var li=document.createElement('li'), sp=document.createElement('span'); sp.className='empty'; sp.textContent='아직 기록이 없어요'; li.appendChild(sp); ul.appendChild(li); }
    paintOrders();
    S.log.slice(0,8).forEach(function(r){ var li=document.createElement('li'), tm=document.createElement('time'), sp=document.createElement('span'); tm.textContent=r.t; sp.className=r.kind; sp.textContent=r.text; li.appendChild(tm); li.appendChild(sp); ul.appendChild(li); });
    paintSel();
  }

  // ── 0.7초마다 서버에 물어보기 ──
  function poll(){
    return fetch('/api/state',{cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
      var redraw=!S||(j.tables||[]).join()!==tables.join(); S=j; if(j.tables&&j.tables.length) tables=j.tables;
      if(redraw) drawSpots(); paint();
    }).catch(function(){
      $('pill').className='pill off'; $('pillT').textContent='서버 끊김';
      $('title').textContent='서버에 닿지 않아요'; $('sub').textContent='노트북의 web_order.py 가 켜져 있는지 확인하세요'; $('tag').textContent='끊김'; $('now').className='now bad';
    });
  }
  drawSpots(); paintSel(); poll(); setInterval(poll,700);
})();
</script>
</body>
</html>
